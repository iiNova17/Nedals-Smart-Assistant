[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nedals-smart-assistant"
version = "0.1.0"
description = "Nedal’s team engineering assistant — incremental MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "Pillow>=12.3,<13",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "google-genai>=1.75,<2",
  "google-auth-oauthlib>=1.2,<2",
  "google-api-python-client>=2.0,<3",
  "pypdf>=6,<7",
  "tzdata>=2026.1",
  "ddgs>=9.16,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
